services:
  loggerbin:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - loggerbin-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  loggerbin-data:
